<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta property="og:image" content="https://www.dtek-dnem.com.ua/media/page/news-image-1200-1585899488629.png">
    <title>Графік</title>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600&display=swap');

      body {
        font-family: 'Baloo 2', cursive;
        margin: 0;
        padding: 40px 20px;
        background: linear-gradient(135deg, #ffecd2 0%, #fcb69f 100%);
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        color: #333;
      }

      main {
        max-width: 700px;
        width: 100%;
        background: #fff;
        border-radius: 20px;
        box-shadow: 0 8px 24px rgba(0,0,0,0.15);
        overflow: hidden;
        animation: slideUp 0.8s ease;
      }

      @keyframes slideUp {
        from { opacity: 0; transform: translateY(30px); }
        to { opacity: 1; transform: translateY(0); }
      }

      header {
        background: linear-gradient(90deg, #ff6f61, #ff9966);
        color: #fff;
        padding: 20px;
        text-align: center;
      }

      header h1 {
        margin: 0;
        font-size: 2rem;
        font-weight: 600;
      }

      section {
        padding: 25px;
        border-bottom: 1px solid #eee;
      }

      section:last-child {
        border-bottom: none;
      }

      h2 {
        margin-top: 0;
        font-size: 1.5rem;
        color: #444;
      }

      .schedule-block {
        background: #f9f9f9;
        padding: 15px;
        border-radius: 12px;
        box-shadow: inset 0 2px 6px rgba(0,0,0,0.05);
        transition: transform 0.3s ease, background 0.3s ease;
        font-size: 1.1rem;
      }

      .schedule-block:hover {
        transform: scale(1.02);
        background: #fffbe6;
      }

      #today-schedule {
        border-left: 6px solid #4caf50;
      }

      #tomorrow-schedule {
        border-left: 6px solid #2196f3;
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>Мій графік</h1>
      </header>
      <section>
        <h2>Сьогодні</h2>
        <div id="today-schedule" class="schedule-block">{{today}}</div>
      </section>
      <section>
        <h2>Завтра</h2>
        <div id="tomorrow-schedule" class="schedule-block">{{tomorrow}}</div>
      </section>
    </main>
  </body>
</html>
